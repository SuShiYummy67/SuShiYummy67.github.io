<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SummerDreams — Discord</title>
  <meta http-equiv="refresh" content="2; url=https://discord.gg/qYJAttWbzY" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07080d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      padding: 20px;
    }
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(168, 85, 247, 0.28);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: #a855f7;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.28);
    }
    .icon svg { width: 36px; height: 36px; fill: #fff; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
    .bar {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: #a855f7;
      animation: load 1.8s ease-out forwards;
    }
    @keyframes load { to { width: 100%; } }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      background: #a855f7;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
  <script>
    setTimeout(function() {
      window.location.href = "https://discord.gg/qYJAttWbzY";
    }, 1800);
  </script>
